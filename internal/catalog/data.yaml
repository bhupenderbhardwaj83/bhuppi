    - bhuppi files find . --oneof a,b,c
    - bhuppi files find . --regex '.*\.go'
    - bhuppi files find . --contains readme --sensitivecase
    - bhuppi files find . --contains readme --insensitivecase
    - bhuppi files find readme . --word
    - bhuppi files find . --contains readme --invert
    when: You know the glob and the tree to walk, or you want a simple contains, starts-with, ends-with, class, or list of names.
    rule: 'With no shape flag the pattern is a shell glob: fd --glob when fd is on PATH, otherwise find -name. --contains TEXT is find -name ''*TEXT*''. --startswith TEXT is ''TEXT*''. --endswith TEXT is ''*TEXT''. --anyof a-z is a character class, ''*[a-z]*'', and the class moves to the anchor when you also pass contains, startswith, or endswith. --oneof a,b,c is find ( -name a -o -name b -o -name c ), with the same anchor on each value. --regex PATTERN is your regex, not a translation. On this Mac that is find PATH -regex PATTERN, which is BSD find and matches the whole path. --sensitivecase is the default and keeps -name. --insensitivecase uses -iname. --regex with --insensitivecase is find PATH -iregex PATTERN; the pattern is not rewritten. --word on find means the file name is exactly TEXT (-name TEXT). With --contains, find has no word-boundary flag, so the pattern stays ''*TEXT*''. --invert is ! -name or ! -iname. --line is for text search. --dry-run prints the argv that will actually
      run.'
    desc: NAME then optional PATH when you are using a glob. With a shape flag, the positional is the path and it defaults to `.`. Quote globs so your shell does not expand them. Children name, type, size, time, and exec call find.
    not_this: Not Windows find.exe. Not a content search; that is text search. These flags are not a second regex language; --regex is still the raw pattern.
    runs: find . -name '*.go'
    also_linux: find . -regextype posix-extended -regex '.*\.go'
    also_macos: find . -regex '.*\.go'
