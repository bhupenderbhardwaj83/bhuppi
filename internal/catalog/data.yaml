recipes:
- name: disk-hogs
  title: largest directories
  what: Show which directories directly under DIR use the most space.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: Prints du, sort, and head. DIR defaults to `.`. --run executes the pipeline.
  not_this: Not a delete of large files.
  more: bhuppi help recipe disk-hogs
  shape: bhuppi recipe disk-hogs [DIR]
  example: bhuppi recipe disk-hogs .
  delivery: recipe
  unix:
  - disk-hogs
  steps:
  - - du
    - -h
    - -d
    - '1'
    - '{dir}'
  - - sort
    - -hr
  - - head
    - -n
    - '20'
  steps_linux:
  - - du
    - -h
    - --max-depth=1
    - '{dir}'
  - - sort
    - -hr
  - - head
    - -n
    - '20'
  also_linux: du -h --max-depth=1 . | sort -hr | head -n 20
  also_macos: du -h -d 1 . | sort -hr | head -n 20
  runs_linux: du -h --max-depth=1 . | sort -hr | head -n 20
  runs_darwin: du -h -d 1 . | sort -hr | head -n 20
- name: who-listens
  title: listeners on this machine
  what: Show TCP listeners on this machine.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: Linux prints ss -lptn. macOS prints lsof for LISTEN sockets.
  not_this: Not a scan of other hosts.
  more: bhuppi help recipe who-listens
  shape: bhuppi recipe who-listens
  example: bhuppi recipe who-listens
  delivery: recipe
  unix:
  - who-listens
  steps:
  - - ss
    - -lptn
  steps_linux:
  - - ss
    - -lptn
  steps_darwin:
  - - lsof
    - -nP
    - -iTCP
    - -sTCP:LISTEN
  also_linux: ss -lptn
  also_macos: lsof -nP -iTCP -sTCP:LISTEN
- name: newest-in
  title: newest files
  what: List the newest files under DIR.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: GNU find may use -printf. BSD find uses stat. --dry-run prints the form for this OS.
  not_this: Not a wipe of old files.
  more: bhuppi help recipe newest-in
  shape: bhuppi recipe newest-in [DIR]
  example: bhuppi recipe newest-in .
  delivery: recipe
  unix:
  - newest-in
  steps:
  - - find
    - '{dir}'
    - -type
    - f
    - -exec
    - ls
    - -lt
    - '{}'
    - +
  steps_linux:
  - - find
    - '{dir}'
    - -type
    - f
    - -printf
    - '%T@ %p\n'
  - - sort
    - -nr
  - - head
    - -n
    - '20'
  steps_darwin:
  - - find
    - '{dir}'
    - -type
    - f
    - -exec
    - stat
    - -f
    - '%m %N'
    - '{}'
    - +
  - - sort
    - -nr
  - - head
    - -n
    - '20'
  also_linux: find . -type f -printf '%T@ %p\n' | sort -nr | head -n 20
  also_macos: find . -type f -exec stat -f '%m %N' {} + | sort -nr | head -n 20
- name: checksum
  title: SHA-256 a file
  what: Print the SHA-256 checksum of FILE.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: Linux runs sha256sum. macOS runs shasum -a 256.
  not_this: Not MD5 unless you use data hash md5. Not a cracker.
  more: bhuppi help recipe checksum
  shape: bhuppi recipe checksum FILE
  example: bhuppi recipe checksum README
  delivery: recipe
  unix:
  - checksum
  steps:
  - - sha256sum
    - '{file}'
  steps_linux:
  - - sha256sum
    - '{file}'
  steps_darwin:
  - - shasum
    - -a
    - '256'
    - '{file}'
  also_linux: sha256sum FILE
  also_macos: shasum -a 256 FILE
- name: tar-dir
  title: tar a directory
  what: Create DIR.tar.gz beside the job by running tar -czf.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: The archive name is the directory's base name plus .tar.gz. --run creates it in the current directory.
  not_this: Not an extract. Not a tar of a path you did not name.
  more: bhuppi help recipe tar-dir
  shape: bhuppi recipe tar-dir DIR
  example: bhuppi recipe tar-dir logs
  delivery: recipe
  unix:
  - tar-dir
  steps:
  - - tar
    - -czf
    - '{archive}'
    - '{dir}'
- name: cron-mine
  title: your crontab
  what: Print your user crontab.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: The pipeline is crontab -l. It does not edit.
  not_this: Not crontab -e unless you run svc cron -e yourself. Not a system cron install.
  more: bhuppi help recipe cron-mine
  shape: bhuppi recipe cron-mine
  example: bhuppi recipe cron-mine
  delivery: recipe
  unix:
  - cron-mine
  steps:
  - - crontab
    - -l
- name: conn-mine
  title: your TCP connections
  what: Show established TCP connections on this machine.
  when: You want this exact pipeline and you want to read it first.
  rule: The pipeline is fixed. Arguments fill placeholders only. Default prints the line; --run executes it.
  desc: Linux uses ss -tp. macOS uses lsof for ESTABLISHED sockets.
  not_this: Not a scan. Not a packet capture.
  more: bhuppi help recipe conn-mine
  shape: bhuppi recipe conn-mine
  example: bhuppi recipe conn-mine
  delivery: recipe
  unix:
  - conn-mine
  steps:
  - - ss
    - -tp
  steps_linux:
  - - ss
    - -tp
  steps_darwin:
  - - lsof
    - -nP
    - -iTCP
    - -sTCP:ESTABLISHED
  also_linux: ss -tp
  also_macos: lsof -nP -iTCP -sTCP:ESTABLISHED
